# catalogo.semilleroelmanantial.com.ar -> sitio estático en /var/www/catalogo
#
# Instalación en el VPS (165.1.123.161):
#   sudo cp nginx-catalogo.conf /etc/nginx/sites-available/catalogo
#   sudo ln -s /etc/nginx/sites-available/catalogo /etc/nginx/sites-enabled/catalogo
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d catalogo.semilleroelmanantial.com.ar
#
# Antes: agregar en Cloudflare el A-record `catalogo` -> 165.1.123.161 en modo
# DNS-only (igual que los otros subdominios del VPS; con el proxy naranja
# certbot no valida).

server {
    listen 80;
    server_name catalogo.semilleroelmanantial.com.ar;

    root /var/www/catalogo;
    index index.html;

    # Mismo criterio de headers que el resto de los sitios del VPS.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # El HTML se regenera con cada cambio de precios: no cachearlo.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Fotos, fuentes e íconos casi no cambian.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    gzip on;
    gzip_types text/html text/css application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    client_max_body_size 1m;
}
